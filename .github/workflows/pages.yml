# Publicación en GitHub Pages con los datos del día.
#
# Requiere en el repositorio (Settings → Secrets and variables → Actions):
#   secreto  GTFS_URL   dirección del paquete GTFS (no se escribe en el código)
#   variable API_BASE   dirección del Worker (https://transmi-live.<subdominio>.workers.dev)
#   variable SITE_URL   dirección publicada (opcional; por defecto https://<usuario>.github.io/<repo>/)
# y Pages con «GitHub Actions» como fuente. Se lanza a mano o a diario, después de que el paquete
# se regenera (≈ 04:20 de Bogotá).
name: Publicar en Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *' # 05:00 de Bogotá

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar configuración
        env:
          GTFS_URL: ${{ secrets.GTFS_URL }}
          API_BASE: ${{ vars.API_BASE }}
        run: |
          test -n "$GTFS_URL" || { echo "::error::Falta el secreto GTFS_URL"; exit 1; }
          test -n "$API_BASE" || { echo "::error::Falta la variable API_BASE"; exit 1; }
      - name: Pruebas de las herramientas de datos
        run: python3 tools/test_busway.py && python3 tools/test_diff.py && python3 tools/test_fleet.py
      - name: Datos publicados (para comparar)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          # Lo que está en línea es el estado anterior: la compilación compara contra eso y conserva el
          # historial de cambios y los alias de ids. La primera vez no hay nada y no pasa nada.
          site="${SITE_URL:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/}"
          mkdir -p public/data
          for f in network.json patterns.json stops.json changes.json meta.json; do
            curl -sfL --retry 2 -o "public/data/$f" "${site%/}/data/$f" || rm -f "public/data/$f"
          done
          ls -la public/data
      - name: Datos de la red
        env:
          GTFS_URL: ${{ secrets.GTFS_URL }}
        run: |
          curl -sfL --retry 3 -o "$RUNNER_TEMP/gtfs.zip" "$GTFS_URL"
          python3 tools/build_data.py "$RUNNER_TEMP/gtfs.zip"
      - name: Series de flota nuevas
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          # Una petición al Worker: buses troncales y duales cuyo número no está en fleet.json (al issue).
          python3 tools/check_fleet.py "$API_BASE" || echo "::warning::No se pudo revisar la flota"
      - name: Avisar si hay que revisar lo curado
        if: hashFiles('.cache/revision.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Lo que no se actualiza solo (letras, ejes, huellas, calzada) queda en un issue con la lista.
          test -s .cache/revision.txt || exit 0
          title="Revisar datos curados de la red"
          body="$(printf 'Revisión automática del %s:\n\n' "$(date +%F)"; sed 's/^/- /' .cache/revision.txt)"
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
      - run: npm ci
      - run: npm test
      - name: Compilar
        env:
          VITE_API_BASE: ${{ vars.API_BASE }}
        run: npm run build
      - name: Ninguna dirección de fuente en lo publicado
        env:
          GTFS_URL: ${{ secrets.GTFS_URL }}
        run: |
          host=$(echo "$GTFS_URL" | sed -E 's#^[a-z]+://([^/]+).*#\1#')
          ! grep -rIlF "$host" dist/ || { echo "::error::La dirección de una fuente quedó en la compilación"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
